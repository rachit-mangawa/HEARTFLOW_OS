name: Deploy HeartFlow OS (Backend to HF, Frontend to GH Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-backend-to-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash -s
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # We upload the root, but exclude the frontend logic and git folders.
        # This will use the Dockerfile at the root to deploy the FastAPI server.
        run: |
          hf upload IDKHowToCodeFr/tinyml-backend . \
            --type space \
            --delete "*" \
            --exclude "frontend/node_modules/*" \
            --exclude "frontend/.next/*" \
            --exclude ".git/*" \
            --exclude ".github/*"

  deploy-frontend-to-pages:
    runs-on: ubuntu-latest
    needs: deploy-backend-to-hf
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Build Next.js Static Export
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://idkhowtocodefr-tinyml-backend.hf.space
          NEXT_PUBLIC_WS_URL: wss://idkhowtocodefr-tinyml-backend.hf.space/ws/feed
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
