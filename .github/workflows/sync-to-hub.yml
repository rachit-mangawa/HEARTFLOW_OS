name: Deploy HeartFlow OS (Backend to HF, Frontend to GH Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-backend-to-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hugging Face Hub CLI
        run: pip install -U "huggingface_hub[cli]"

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # We upload the root, but exclude the frontend logic and git folders.
        # This will use the Dockerfile at the root to deploy the FastAPI server.
        run: |
          python -m huggingface_hub.cli upload IDKHowToCodeFr/tinyml-backend . \
            --repo-type space \
            --exclude "frontend/node_modules/*" \
            --exclude "frontend/.next/*" \
            --exclude ".git/*" \
            --exclude ".github/*"

  deploy-frontend-to-pages:
    runs-on: ubuntu-latest
    needs: deploy-backend-to-hf
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://idkhowtocodefr-tinyml-backend.hf.space
          NEXT_PUBLIC_WS_URL: wss://idkhowtocodefr-tinyml-backend.hf.space/ws/feed
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
